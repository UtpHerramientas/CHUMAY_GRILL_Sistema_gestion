<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Chumay Chifa Parrillas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login-style.css}">
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <img th:src="@{/img/logo.jpg}" alt="Chumay Logo" class="login-logo">
            <h1>Bienvenido</h1>
            <p>Panel Ejecutivo de Gestión</p>
        </div>

        <form th:action="@{/login}" method="post" class="login-form">
            <!-- Mensaje de Error -->
            <div th:if="${param.error}" class="alert alert-danger" style="text-align: center; font-size: 0.9em; padding: 10px; margin-bottom: 15px; border-radius: 5px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb;">
                Usuario o contraseña incorrectos.
            </div>

            <div class="input-group-custom">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Usuario" required>
            </div>

            <div class="input-group-custom">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Recordarme
                </label>
                <a href="#" class="forgot-link">¿Olvidó su clave?</a>
            </div>

            <button type="submit" class="btn-login">
                <span>Ingresar</span>
                <i class="fas fa-chevron-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <p>&copy; 2026 Chumay Chifa Parrillas - Sistema de Control</p>
        </div>
    </div>
</div>

</body>
</html>
