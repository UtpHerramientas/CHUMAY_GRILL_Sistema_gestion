<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK's Gourmet | Experiencia Gastronómica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img th:src="@{/img/logo.jpg}" alt="Logo" width="50" class="me-2 rounded-circle border border-warning shadow-sm">
            <span class="brand-text">CHYMAY - GRILL</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/catalogo">Catálogo</a></li>
                <li class="nav-item">
                    <a class="nav-link position-relative" href="/carrito">
                        <i class="fas fa-shopping-cart"></i> Carrito
                        <span id="cart-count" class="badge bg-danger rounded-pill">0</span>
                    </a>
                </li>
                <li class="nav-item ms-lg-3">
                    <a class="btn btn-login rounded-pill" th:href="@{/login}">Iniciar Sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div id="promoCarousel" class="carousel slide main-carousel" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active" id="item-promo-1">
            <div class="carousel-caption">
                <h2 class="display-4">Combo Dúo Marino</h2>
                <p>2 Ceviches + Chicha Morada a un precio especial.</p>
                <button class="btn btn-warning btn-action">Pedir Ahora</button>
            </div>
        </div>
        <div class="carousel-item" id="item-promo-2">
            <div class="carousel-caption">
                <h2 class="display-4">Banquete Familiar</h2>
                <p>Ideal para 4 personas. Variedad de platos criollos.</p>
                <button class="btn btn-warning btn-action">Ver Detalle</button>
            </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#promoCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#promoCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

<section class="container my-5" id="top-platos">
    <div class="text-center mb-5">
        <h2 class="display-5 fw-bold">Los Favoritos del Chef</h2>
        <div class="divider-gold"></div>
    </div>
    <div class="row g-4" id="top-platos-container">
    </div>
</section>

    <!-- El catálogo ahora se encuentra en su propia página: /catalogo -->

<footer class="footer-dark py-4 mt-5 text-center">
    <div class="container">
        <img th:src="@{/img/logo.jpg}" alt="Logo" width="60" class="mb-3 rounded-circle border border-warning shadow">
        <p class="mb-0">&copy; 2026 LK's Gourmet - Excelencia Lambayecana</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
